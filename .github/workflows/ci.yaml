name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Instalar Chrome e ChromeDriver
      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 156
          install-chromedriver: true

      # 5. Análise estática
      - name: ESLint
        run: npm run lint

      # 6. Testes unitários e cobertura
      - name: Testes unitários e cobertura
        run: npm run test:unit

      # 7. Teste de interface com Selenium
      - name: Teste Selenium - Google
        run: npm run test:e2e
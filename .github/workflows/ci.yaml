
name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Instalar Chrome e ChromeDriver compatíveis
      - name: Configurar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      # 5. Configurar caminhos corretos
      - name: Configurar executáveis
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      # 6. Conferir versões
      - name: Verificar Chrome e ChromeDriver
        run: |
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          ${{ steps.setup-chrome.outputs.chromedriver-path }} --version

      # 7. Análise estática
      - name: ESLint
        run: npm run lint

      # 8. Testes unitários e cobertura
      - name: Testes unitários e cobertura
        run: npm run test:unit

      # 9. Teste de interface com Selenium
      - name: Teste Selenium - Google
        run: npm run test:e2e

name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm ci

      # 4. Instalar Chrome e ChromeDriver compatíveis
      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      # 4.1. Definir o caminho correto do Chrome
      - name: Configurar caminho do Chrome
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      # 4.2. Conferir versões instaladas
      - name: Verificar Chrome e ChromeDriver
        run: |
          echo "Chrome:"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version
          echo "ChromeDriver:"
          ${{ steps.setup-chrome.outputs.chromedriver-path }} --version

      # 5. Análise estática
      - name: ESLint
        run: npm run lint

      # 6. Testes unitários e cobertura
      - name: Testes unitários e cobertura
        run: npm run test:unit

      # 7. Teste de interface com Selenium
      - name: Teste Selenium - Google
        run: npm run test:e2e